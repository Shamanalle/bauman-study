name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate practice bundles
        run: npm run validate:practice

      - name: Build web application (Vite)
        run: npm run build

      - name: Build offline standalone bundles
        run: npm run bundle

      - name: Build single-file platform
        run: npm run build:platform
