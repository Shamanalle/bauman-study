<svg viewBox="0 0 400 160" width="400" height="160">
  <defs>
    <marker id="arrR" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0 0, 6 3, 0 6" fill="#0969da"/></marker>
    <marker id="arrF" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0 0, 6 3, 0 6" fill="#e5534b"/></marker>
    <marker id="arrM" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0 0, 6 3, 0 6" fill="#8250df"/></marker>
  </defs>

  <polygon points="60 130, 240 130, 320 80, 140 80" fill="rgba(139, 148, 158, 0.05)" stroke="var(--text2)" stroke-width="1"/>

  <line x1="160" y1="150" x2="160" y2="20" stroke="var(--text2)" stroke-width="1.5" stroke-dasharray="4"/>
  <circle cx="160" cy="110" r="4" fill="var(--text)"/> <text x="145" y="120" font-size="12" fill="var(--text)" font-weight="bold">O</text>

  <line x1="160" y1="110" x2="250" y2="110" stroke="#0969da" stroke-width="3" marker-end="url(#arrR)"/>
  <text x="200" y="105" font-size="14" fill="#0969da" font-weight="bold">r</text>

  <line x1="250" y1="110" x2="310" y2="60" stroke="#e5534b" stroke-width="3" marker-end="url(#arrF)"/>
  <text x="290" y="55" font-size="14" fill="#e5534b" font-weight="bold">F</text>

  <line x1="250" y1="110" x2="310" y2="110" stroke="#0969da" stroke-width="1.5" stroke-dasharray="4"/>
  
  <path d="M 280 110 A 30 30 0 0 0 274 90" fill="none" stroke="#2da44e" stroke-width="2"/>
  <text x="285" y="100" font-size="12" fill="#2da44e" font-weight="bold">α</text>

  <line x1="160" y1="110" x2="160" y2="30" stroke="#8250df" stroke-width="3.5" marker-end="url(#arrM)"/>
  <text x="140" y="50" font-size="14" fill="#8250df" font-weight="bold">M</text>

  <rect x="230" y="125" width="160" height="25" rx="4" fill="rgba(88,166,255,0.15)" stroke="#0969da" stroke-width="1.5"/>
  <text x="240" y="142" font-size="11" fill="#0969da" font-weight="bold">M = [r × F] = r·F·sin(α)</text>
