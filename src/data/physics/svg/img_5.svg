<svg viewBox="0 0 440 185" width="440" height="185">
  <defs>
    <marker id="arrX5" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0 0, 6 3, 0 6" fill="#8b949e"/></marker>
  </defs>

  <!-- Axes -->
  <line x1="30" y1="92" x2="410" y2="92" stroke="#d0d7de" stroke-width="1.5" marker-end="url(#arrX5)"/>
  <line x1="42" y1="170" x2="42" y2="10" stroke="#d0d7de" stroke-width="1.5" marker-end="url(#arrX5)"/>
  <text x="416" y="98" font-size="14" fill="#8b949e" font-weight="600">t</text>
  <text x="24" y="18" font-size="14" fill="#8b949e" font-weight="600">x</text>

  <!-- Amplitude bounds -->
  <line x1="30" y1="28" x2="400" y2="28" stroke="#2da44e" stroke-width="1.5" stroke-dasharray="5"/>
  <line x1="30" y1="156" x2="400" y2="156" stroke="#2da44e" stroke-width="1.5" stroke-dasharray="5"/>
  <text x="16" y="34" font-size="14" fill="#2da44e" font-weight="bold">A</text>
  <text x="10" y="162" font-size="14" fill="#2da44e" font-weight="bold">-A</text>

  <!-- Cosine wave — smooth cubic Bézier between amplitude bounds -->
  <path d="M 42 28 C 75 28, 85 156, 120 156 C 155 156, 165 28, 200 28 C 235 28, 245 156, 280 156 C 315 156, 325 28, 360 28 C 380 28, 394 60, 408 92" fill="none" stroke="#0969da" stroke-width="2.8"/>

  <!-- Moving point on wave -->
  

  <!-- Period marker T (between first two peaks) -->
  <line x1="42" y1="16" x2="200" y2="16" stroke="#e5534b" stroke-width="2"/>
  <line x1="42" y1="10" x2="42" y2="22" stroke="#e5534b" stroke-width="2"/>
  <line x1="200" y1="10" x2="200" y2="22" stroke="#e5534b" stroke-width="2"/>
  <text x="118" y="13" font-size="14" fill="#e5534b" font-weight="bold" text-anchor="middle">T</text>

  <!-- Formula box (properly inside viewBox) -->
  <rect x="250" y="160" width="178" height="22" rx="6" fill="rgba(9,105,218,0.1)" stroke="#0969da" stroke-width="1.5"/>
  <text x="264" y="176" font-size="12" fill="#0969da" font-weight="bold">x(t) = A · cos(ωt + φ₀)</text>
</svg>