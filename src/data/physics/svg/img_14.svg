<svg viewBox="0 0 440 210" width="440" height="210">
  <defs>
    <marker id="arr14" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0 0, 6 3, 0 6" fill="#8b949e"/></marker>
  </defs>

  <!-- Axes -->
  <line x1="35" y1="178" x2="410" y2="178" stroke="#d0d7de" stroke-width="1.5" marker-end="url(#arr14)"/>
  <line x1="45" y1="190" x2="45" y2="10" stroke="#d0d7de" stroke-width="1.5" marker-end="url(#arr14)"/>
  <text x="416" y="184" font-size="14" fill="#8b949e" font-weight="600">V</text>
  <text x="24" y="18" font-size="14" fill="#8b949e" font-weight="600">P</text>

  <!-- Coexistence dome (binodal) -->
  <path d="M 65 178 Q 105 65 155 65 T 280 178" fill="rgba(139,148,158,0.08)" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5"/>
  <text x="130" y="158" font-size="10" fill="#8b949e" font-weight="bold">жидкость + газ</text>

  <!-- Critical point K (apex of dome) -->
  <circle cx="155" cy="65" r="6" fill="#e5534b"/>
  <text x="163" y="58" font-size="14" fill="#e5534b" font-weight="bold">K</text>

  <!-- T > T_кр (smooth, above critical) -->
  <path d="M 55 32 Q 110 40 165 55 Q 240 78 380 100" fill="none" stroke="#0969da" stroke-width="2.8"/>
  <text x="340" y="92" font-size="12" fill="#0969da" font-weight="bold">T &gt; T<tspan dy="3" font-size="9">кр</tspan>
    
  </text>

  <!-- T = T_кр (passes through critical point) -->
  <path d="M 55 52 Q 95 58 155 65 Q 220 72 380 130" fill="none" stroke="#8b949e" stroke-width="2.8"/>
  <text x="340" y="124" font-size="12" fill="#57606a" font-weight="bold">T = T<tspan dy="3" font-size="9">кр</tspan>
    
  </text>

  <!-- T < T_кр (with horizontal plateau inside dome) -->
  <path d="M 55 78 Q 68 132 85 132 L 230 132 Q 280 132 380 165" fill="none" stroke="#e5534b" stroke-width="2.8"/>
  <text x="340" y="160" font-size="12" fill="#e5534b" font-weight="bold">T &lt; T<tspan dy="3" font-size="9">кр</tspan>
    
  </text>

  <!-- Van der Waals oscillation (metastable, on sub-critical isotherm) -->
  <path d="M 85 132 Q 105 165 157 132 Q 195 96 230 132" fill="none" stroke="#e5534b" stroke-width="1.5" stroke-dasharray="4"/>
</svg>