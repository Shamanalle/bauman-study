<svg viewBox="0 0 440 200" width="440" height="200">
  <defs>
    <marker id="arr15" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0 0, 6 3, 0 6" fill="#8b949e"/></marker>
  </defs>

  <!-- Axes -->
  <line x1="35" y1="170" x2="410" y2="170" stroke="#d0d7de" stroke-width="1.5" marker-end="url(#arr15)"/>
  <line x1="45" y1="180" x2="45" y2="10" stroke="#d0d7de" stroke-width="1.5" marker-end="url(#arr15)"/>
  <text x="416" y="176" font-size="14" fill="#8b949e" font-weight="600">T</text>
  <text x="24" y="18" font-size="14" fill="#8b949e" font-weight="600">P</text>

  <!-- Sublimation curve (solid → gas, from origin-area to triple point) -->
  <path d="M 45 170 Q 85 135 152 100" fill="none" stroke="#8b949e" stroke-width="2.8"/>

  <!-- Melting curve (solid → liquid, from triple point upward) -->
  <path d="M 152 100 Q 178 52 195 15" fill="none" stroke="#e5534b" stroke-width="2.8"/>

  <!-- Vaporization curve (liquid → gas, from triple point to critical point) -->
  <path d="M 152 100 Q 235 78 315 42" fill="none" stroke="#0969da" stroke-width="2.8"/>

  <!-- Triple point (all three curves meet here) -->
  <circle cx="152" cy="100" r="6" fill="#24292f"/>
  <line x1="152" y1="100" x2="152" y2="170" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="138" y="188" font-size="12" fill="#24292f" font-weight="bold">T_тр</text>

  <!-- Critical point K (end of vaporization curve) -->
  <circle cx="315" cy="42" r="5.5" fill="#0969da"/>
  <text x="324" y="38" font-size="13" fill="#0969da" font-weight="bold">K</text>

  <!-- Phase region labels -->
  <text x="68" y="58" font-size="16" fill="#cf222e" font-weight="bold">Твёрдое
    
  </text>
  <text x="210" y="42" font-size="16" fill="#0969da" font-weight="bold">Жидкость
    
  </text>
  <text x="250" y="138" font-size="16" fill="#8b949e" font-weight="bold">Газ
    
  </text>
</svg>