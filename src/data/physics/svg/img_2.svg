<svg viewBox="0 0 460 210" width="460" height="210">
  <defs>
    <marker id="vArr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#0969da"/></marker>
    <marker id="atArr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#e5534b"/></marker>
    <marker id="anArr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#d29922"/></marker>
    <marker id="wArr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#2da44e"/></marker>
  </defs>

  <!-- Orbit circle -->
  <circle cx="145" cy="110" r="75" fill="none" stroke="#d0d7de" stroke-width="2" stroke-dasharray="8,5"/>

  <!-- Center point O -->
  <circle cx="145" cy="110" r="4" fill="#24292f"/>
  <text x="132" y="118" font-size="13" fill="#24292f" font-weight="bold">O</text>

  <!-- Radius line to rightmost point -->
  <line x1="145" y1="110" x2="220" y2="110" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="178" y="104" font-size="13" fill="#8b949e" font-weight="bold">R</text>

  <!-- Moving point on circle (path matches the orbit cx=145 cy=110 r=75) -->
  

  <!-- Velocity vector v (tangent at rightmost point = pointing UP) -->
  <line x1="220" y1="110" x2="220" y2="38" stroke="#0969da" stroke-width="3" marker-end="url(#vArr)"/>
  <text x="228" y="55" font-size="15" fill="#0969da" font-weight="bold">v</text>

  <!-- Tangential acceleration aτ (along v direction, shorter) -->
  <line x1="220" y1="110" x2="220" y2="68" stroke="#e5534b" stroke-width="2.5" marker-end="url(#atArr)"/>
  <text x="228" y="82" font-size="13" fill="#e5534b" font-weight="bold">a<tspan dy="3" font-size="10">τ</tspan></text>

  <!-- Normal acceleration aₙ (centripetal, points toward center) -->
  <line x1="220" y1="110" x2="162" y2="110" stroke="#d29922" stroke-width="2.5" marker-end="url(#anArr)"/>
  <text x="175" y="128" font-size="13" fill="#d29922" font-weight="bold">a<tspan dy="3" font-size="10">n</tspan></text>

  <!-- Angular velocity ω arc (near center, above) -->
  <path d="M 122 78 A 38 38 0 0 1 168 78" fill="none" stroke="#2da44e" stroke-width="2.5" marker-end="url(#wArr)"/>
  <text x="138" y="68" font-size="15" fill="#2da44e" font-weight="bold">ω</text>

  <!-- Formula box (positioned with comfortable padding) -->
  <rect x="275" y="35" width="172" height="120" rx="10" fill="rgba(36,41,47,0.4)" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="292" y="62" font-size="14" fill="#0969da" font-weight="bold">v = ω · R</text>
  <text x="292" y="88" font-size="14" fill="#e5534b" font-weight="bold">a<tspan dy="3" font-size="10">τ</tspan><tspan dy="-3"> = ε · R</tspan></text>
  <text x="292" y="114" font-size="14" fill="#d29922" font-weight="bold">a<tspan dy="3" font-size="10">n</tspan><tspan dy="-3"> = ω² · R</tspan></text>
  <text x="292" y="142" font-size="12" fill="#8b949e" font-weight="600">a = √(aτ² + aₙ²)</text>
</svg>