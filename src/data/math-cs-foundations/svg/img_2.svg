<svg viewBox="0 0 420 170" width="420" height="170">
  <rect x="10" y="10" width="400" height="145" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="28" y="32" font-size="13" fill="#24292f" font-weight="bold">Таблица истинности булевой функции</text>

  <!-- Header -->
  <rect x="28" y="45" width="32" height="22" rx="5" fill="#e6f0fa" stroke="#0969da" stroke-width="1"/>
  <text x="44" y="61" font-size="12" fill="#0969da" font-weight="bold" text-anchor="middle">x₁</text>
  <rect x="65" y="45" width="32" height="22" rx="5" fill="#e6f0fa" stroke="#0969da" stroke-width="1"/>
  <text x="81" y="61" font-size="12" fill="#0969da" font-weight="bold" text-anchor="middle">x₂</text>
  <rect x="105" y="45" width="42" height="22" rx="5" fill="#dafbe1" stroke="#2da44e" stroke-width="1"/>
  <text x="126" y="61" font-size="12" fill="#1a7f37" font-weight="bold" text-anchor="middle">f(x)</text>

  <!-- Rows — staggered -->
  <g>
    <text x="44" y="82" font-size="13" fill="#8b949e" font-family="monospace" text-anchor="middle">0</text>
    <text x="81" y="82" font-size="13" fill="#8b949e" font-family="monospace" text-anchor="middle">0</text>
    <text x="126" y="82" font-size="13" fill="#1a7f37" font-family="monospace" font-weight="bold" text-anchor="middle">1</text>
  </g>
  <g>
    <text x="44" y="98" font-size="13" fill="#8b949e" font-family="monospace" text-anchor="middle">0</text>
    <text x="81" y="98" font-size="13" fill="#8b949e" font-family="monospace" text-anchor="middle">1</text>
    <text x="126" y="98" font-size="13" fill="#1a7f37" font-family="monospace" font-weight="bold" text-anchor="middle">0</text>
  </g>
  <g>
    <text x="44" y="114" font-size="13" fill="#8b949e" font-family="monospace" text-anchor="middle">1</text>
    <text x="81" y="114" font-size="13" fill="#8b949e" font-family="monospace" text-anchor="middle">0</text>
    <text x="126" y="114" font-size="13" fill="#1a7f37" font-family="monospace" font-weight="bold" text-anchor="middle">1</text>
  </g>
  <g>
    <text x="44" y="130" font-size="13" fill="#8b949e" font-family="monospace" text-anchor="middle">1</text>
    <text x="81" y="130" font-size="13" fill="#8b949e" font-family="monospace" text-anchor="middle">1</text>
    <text x="126" y="130" font-size="13" fill="#1a7f37" font-family="monospace" font-weight="bold" text-anchor="middle">0</text>
  </g>

  <line x1="165" y1="45" x2="165" y2="135" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4"/>

  <g>
    <text x="185" y="68" font-size="12" fill="#8b949e" font-weight="bold">Количество строк:</text>
    <text x="320" y="68" font-size="15" fill="#0969da" font-weight="bold">2ⁿ</text>
    <text x="185" y="85" font-size="11" fill="#8b949e">(Лексикографический порядок)</text>
    <text x="185" y="115" font-size="12" fill="#8b949e" font-weight="bold">Всего булевых функций:</text>
    <text x="352" y="115" font-size="15" fill="#cf222e" font-weight="bold">2^(2ⁿ)</text>
  </g>
</svg>