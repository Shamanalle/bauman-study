<svg viewBox="0 0 420 175" width="420" height="175">
  <rect x="20" y="20" width="380" height="55" rx="8" fill="rgba(9,105,218,0.06)" stroke="#54aeff" stroke-width="1.5"/>
  <text x="32" y="42" font-size="12" fill="#57606a" font-weight="bold">x =</text>
  <text x="68" y="42" font-size="15" fill="#24292f" font-family="monospace">1  0  1  1  0  1</text>
  <text x="32" y="65" font-size="12" fill="#57606a" font-weight="bold">y =</text>
  <text x="68" y="65" font-size="15" fill="#24292f" font-family="monospace">1  1  1  0  0  1</text>

  <!-- Animated difference highlights -->
  <rect x="90" y="48" width="18" height="20" rx="4" fill="rgba(207,34,46,0.2)" stroke="#cf222e" stroke-width="1.5"/>
  <rect x="140" y="48" width="18" height="20" rx="4" fill="rgba(207,34,46,0.2)" stroke="#cf222e" stroke-width="1.5"/>

  <!-- Distance result -->
  <text x="210" y="102" font-size="14" fill="#cf222e" font-weight="bold" text-anchor="middle">ρ(x, y) = 2
    
  </text>
  <text x="210" y="120" font-size="11" fill="#57606a" text-anchor="middle">(2 несовпадающих разряда — красные)
    
  </text>

  <!-- Formula box -->
  <g>
    
    <rect x="60" y="135" width="300" height="30" rx="6" fill="rgba(45,164,78,0.08)" stroke="#2da44e" stroke-width="1.5"/>
    <text x="210" y="155" font-size="12" fill="#1a4731" font-weight="bold" text-anchor="middle">ρ(x,y) = #{i : xᵢ ≠ yᵢ} — число несовпадающих разрядов</text>
  </g>
</svg>