<svg viewBox="0 0 420 150" width="420" height="150">
  <text x="10" y="22" font-size="13" fill="#24292f" font-weight="bold">Контактная схема (Функция проводимости)</text>

  <!-- Wires and connections with staggered appearance -->
  <g>
    <line x1="20" y1="72" x2="62" y2="72" stroke="#24292f" stroke-width="2"/>
    <circle cx="62" cy="72" r="4" fill="#24292f"/>
    <path d="M 62 72 L 62 37 L 102 37" fill="none" stroke="#24292f" stroke-width="2"/>
    <path d="M 62 72 L 62 107 L 102 107" fill="none" stroke="#24292f" stroke-width="2"/>
  </g>

  <!-- Switch x₁ -->
  <g>
    <line x1="102" y1="37" x2="138" y2="17" stroke="#0969da" stroke-width="2.5"/>
    <path d="M 142 37 L 182 37 L 182 72" fill="none" stroke="#24292f" stroke-width="2"/>
    <circle cx="102" cy="37" r="3.5" fill="#0969da"/>
    <circle cx="142" cy="37" r="3.5" fill="#0969da"/>
    <text x="112" y="22" font-size="14" fill="#0969da" font-weight="bold">x₁</text>
  </g>

  <!-- Switch x₂ -->
  <g>
    <line x1="102" y1="107" x2="138" y2="87" stroke="#e5534b" stroke-width="2.5"/>
    <path d="M 142 107 L 182 107 L 182 72" fill="none" stroke="#24292f" stroke-width="2"/>
    <circle cx="102" cy="107" r="3.5" fill="#e5534b"/>
    <circle cx="142" cy="107" r="3.5" fill="#e5534b"/>
    <text x="112" y="128" font-size="14" fill="#e5534b" font-weight="bold">x₂</text>
  </g>

  <!-- Junction and x₃ -->
  <g>
    <circle cx="182" cy="72" r="4" fill="#24292f"/>
    <line x1="182" y1="72" x2="222" y2="72" stroke="#24292f" stroke-width="2"/>
    <line x1="222" y1="72" x2="258" y2="52" stroke="#2da44e" stroke-width="2.5"/>
    <line x1="262" y1="72" x2="302" y2="72" stroke="#24292f" stroke-width="2"/>
    <circle cx="222" cy="72" r="3.5" fill="#2da44e"/>
    <circle cx="262" cy="72" r="3.5" fill="#2da44e"/>
    <text x="232" y="95" font-size="14" fill="#2da44e" font-weight="bold">x₃</text>
  </g>

  <!-- Formula -->
  <g>
    <rect x="282" y="102" width="132" height="32" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="295" y="123" font-size="13" fill="#24292f" font-weight="bold">f = (x₁ ∨ x₂) ∧ x₃</text>
  </g>
</svg>