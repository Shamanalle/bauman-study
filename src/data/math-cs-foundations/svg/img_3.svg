<svg viewBox="0 0 420 150" width="420" height="150">
  <!-- DNF card -->
  <g transform="translate(10, 10)">
    
    <rect x="0" y="0" width="195" height="95" rx="8" fill="rgba(9,105,218,.1)" stroke="#0969da" stroke-width="1.5"/>
    <text x="15" y="22" font-size="13" fill="#0969da" font-weight="bold">ДНФ</text>
    <text x="15" y="48" font-size="12" fill="#24292f" font-weight="bold" font-family="monospace">(x₁ ∧ x₂) ∨ (¬x₁ ∧ x₃)</text>
    <rect x="15" y="62" width="160" height="22" rx="5" fill="rgba(139,148,158,0.1)"/>
    <text x="22" y="78" font-size="10" fill="#0969da" font-weight="bold">Дизъюнкция (∨) конъюнкций</text>
  </g>

  <!-- CNF card -->
  <g transform="translate(215, 10)">
    
    <rect x="0" y="0" width="195" height="95" rx="8" fill="rgba(255,123,114,0.12)" stroke="#cf222e" stroke-width="1.5"/>
    <text x="15" y="22" font-size="13" fill="#cf222e" font-weight="bold">КНФ</text>
    <text x="15" y="48" font-size="12" fill="#24292f" font-weight="bold" font-family="monospace">(x₁ ∨ x₂) ∧ (¬x₁ ∨ x₃)</text>
    <rect x="15" y="62" width="160" height="22" rx="5" fill="rgba(139,148,158,0.1)"/>
    <text x="22" y="78" font-size="10" fill="#cf222e" font-weight="bold">Конъюнкция (∧) дизъюнкций</text>
  </g>

  <!-- Theorem -->
  <text x="10" y="133" font-size="12" fill="#8b949e" font-weight="bold">Теорема: Любая булева функция представима в ДНФ и КНФ
    
  </text>
</svg>