<svg viewBox="0 0 420 150" width="420" height="150">
  <rect x="10" y="10" width="400" height="128" rx="8" fill="rgba(36,41,47,0.4)" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="25" y="32" font-size="13" fill="#24292f" font-weight="bold">Алгебраическая нормальная форма (АНФ)</text>

  <g>
    <rect x="25" y="48" width="368" height="42" rx="6" fill="rgba(46,160,67,0.12)" stroke="#2da44e" stroke-width="1.5"/>
    <text x="38" y="75" font-size="15" fill="#1a7f37" font-family="monospace" font-weight="bold">f = c₀ ⊕ c₁x₁ ⊕ c₂x₂ ⊕ c₁₂x₁x₂ ⊕ ...</text>
  </g>

  <g>
    <text x="25" y="112" font-size="12" fill="#8b949e"><tspan font-weight="bold">Полином Жегалкина:</tspan> сумма (XOR) одночленов (AND).</text>
    <text x="25" y="128" font-size="12" fill="#8b949e">Коэффициенты cᵢ ∈ {0, 1}</text>
