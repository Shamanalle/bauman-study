<svg viewBox="0 0 420 160" width="420" height="160">
  <defs><marker id="arrExt" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#0969da"/></marker></defs>

  <!-- Outer ellipse (full system) -->
  <ellipse cx="145" cy="80" rx="115" ry="68" fill="rgba(36,41,47,0.4)" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="145" y="42" font-size="13" fill="#8b949e" font-weight="bold" text-anchor="middle">Полная система B</text>
  <text x="145" y="58" font-size="10" fill="#8b949e" text-anchor="middle">(может быть бесконечной)</text>

  <!-- Inner ellipse (subsystem) -->
  <ellipse cx="145" cy="105" rx="58" ry="32" fill="rgba(46,160,67,0.12)" stroke="#4ac26b" stroke-width="2"/>
  <text x="145" y="100" font-size="13" fill="#1a7f37" font-weight="bold" text-anchor="middle">Подсистема B'
    
  </text>
  <text x="145" y="118" font-size="12" fill="#1a7f37" font-weight="bold" text-anchor="middle">|B'| ≤ 4
    
  </text>

  <!-- Arrow + info -->
  <g>
    <path d="M 204 105 Q 248 105 258 88" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#arrExt)"/>
    <rect x="248" y="52" width="165" height="42" rx="6" fill="rgba(9,105,218,.1)" stroke="#0969da" stroke-width="1.5"/>
    <text x="260" y="70" font-size="12" fill="#0969da" font-weight="bold">Выделение подсистемы</text>
    <text x="260" y="85" font-size="11" fill="#0969da">B' также будет полной!</text>
  </g>
</svg>