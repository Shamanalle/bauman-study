<svg viewBox="0 0 400 180" width="400" height="180">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="var(--text2)"/>
    </marker>
  </defs>

  <!-- Grid/Axes -->
  <line x1="5" y1="110" x2="380" y2="110" stroke="var(--text2)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="15" y1="160" x2="15" y2="10" stroke="var(--text2)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="385" y="115" font-size="12" fill="var(--text2)" font-family="sans-serif">x</text>
  <text x="5" y="15" font-size="12" fill="var(--text2)" font-family="sans-serif">y</text>

  <text x="25" y="125" fill="var(--text)" font-size="14" font-style="italic" font-family="serif">a</text>
  <text x="295" y="125" fill="var(--text)" font-size="14" font-style="italic" font-family="serif">b</text>

  <!-- Flipped Area |f| -->
  <path d="M 30 110 C 70 40, 100 40, 130 110 Z" fill="rgba(9, 105, 218, 0.15)"/>
  <path d="M 30 110 C 70 40, 100 40, 130 110" fill="none" stroke="#0969da" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Original Negative Area -->
  <path d="M 30 110 C 70 180, 100 180, 130 110 Z" fill="rgba(207, 34, 46, 0.15)"/>
  
  <!-- Original Positive Area -->
  <path d="M 130 110 C 160 40, 240 40, 300 110 Z" fill="rgba(45, 164, 78, 0.15)"/>
  
  <!-- Original Function Curve -->
  <path d="M 30 110 C 70 180, 100 180, 130 110 C 160 40, 240 40, 300 110" fill="none" stroke="var(--text)" stroke-width="2.5"/>

  <!-- Function labels -->
  <text x="200" y="55" fill="var(--text)" font-size="14" font-style="italic" font-family="serif">f(x)</text>
  <text x="60" y="65" fill="#0969da" font-size="14" font-style="italic" font-family="serif">| f(x) |</text>

  <!-- Area indicators -->
  <text x="80" y="150" fill="#cf222e" font-size="14" font-family="sans-serif" text-anchor="middle" font-weight="bold">-S₁</text>
  <text x="80" y="85" fill="#0969da" font-size="14" font-family="sans-serif" text-anchor="middle" font-weight="bold">+S₁</text>
  <text x="215" y="85" fill="#1a7f37" font-size="14" font-family="sans-serif" text-anchor="middle" font-weight="bold">S₂</text>

  <!-- Equations -->
  <text x="310" y="50" fill="var(--text)" font-size="12" font-family="sans-serif" font-weight="bold">∫ |f| dx = S₂ + S₁</text>
  <text x="310" y="75" fill="var(--text)" font-size="12" font-family="sans-serif" font-weight="bold">|∫ f dx| = |S₂ - S₁|</text>
  
  <text x="310" y="105" fill="#cf222e" font-size="12" font-family="sans-serif" font-weight="bold">| -S₁ + S₂ | &lt; S₁ + S₂</text>
</svg>
