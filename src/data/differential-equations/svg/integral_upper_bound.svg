<svg viewBox="0 0 400 180" width="400" height="180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="var(--text2)"/>
    </marker>
    <marker id="arr-yellow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#e3b341"/>
    </marker>
    
    <path id="curve-area" d="M 60 160 L 60 140 C 100 70, 150 50, 200 90 C 220 106, 250 130, 340 60 L 340 160 Z"/>
    
    <clipPath id="clip-under">
      <path d="M 60 160 L 60 140 C 100 70, 150 50, 200 90 C 220 106, 250 130, 340 60 L 340 160 Z"/>
    </clipPath>
    <clipPath id="clip-phi">
      <rect x="100" y="0" width="100" height="180"/>
    </clipPath>
    <clipPath id="clip-delta">
      <rect x="200" y="0" width="30" height="180"/>
    </clipPath>
  </defs>

  <!-- Axes -->
  <line x1="30" y1="160" x2="380" y2="160" stroke="var(--text2)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="40" y1="170" x2="40" y2="10" stroke="var(--text2)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="385" y="165" font-size="12" fill="var(--text2)" font-family="sans-serif">t</text>
  <text x="25" y="15" font-size="12" fill="var(--text2)" font-family="sans-serif">y</text>

  <!-- Area for Φ(x) -->
  <path d="M 60 160 L 60 140 C 100 70, 150 50, 200 90 C 220 106, 250 130, 340 60 L 340 160 Z" fill="rgba(88, 166, 255, 0.15)" clip-path="url(#clip-phi)"/>
  
  <!-- Area for ΔΦ(x) -->
  <path d="M 60 160 L 60 140 C 100 70, 150 50, 200 90 C 220 106, 250 130, 340 60 L 340 160 Z" fill="rgba(227, 179, 65, 0.3)" clip-path="url(#clip-delta)"/>
  
  <!-- The Curve function f(t) -->
  <path d="M 60 140 C 100 70, 150 50, 200 90 C 220 106, 250 130, 340 60" fill="none" stroke="var(--accent)" stroke-width="2.5"/>

  <!-- Vertical limit lines, clipped perfectly by the curve -->
  <g clip-path="url(#clip-under)">
    <line x1="100" y1="160" x2="100" y2="0" stroke="var(--text2)" stroke-dasharray="4" stroke-width="1.5"/>
    <line x1="200" y1="160" x2="200" y2="0" stroke="var(--text)" stroke-dasharray="4" stroke-width="1.5" />
    <line x1="230" y1="160" x2="230" y2="0" stroke="#e3b341" stroke-dasharray="4" stroke-width="1.5" />
  </g>

  <!-- Rectangle top for f(x) * Δx -->
  <!-- Note: at x=200, y=90 -->
  <line x1="200" y1="90" x2="230" y2="90" stroke="#e3b341" stroke-width="2" />
  <circle cx="200" cy="90" r="4" fill="#e3b341"/>

  <!-- Labels -->
  <text x="100" y="175" fill="var(--text)" font-size="14" font-style="italic" font-family="serif" text-anchor="middle">a</text>
  <text x="200" y="175" fill="var(--text)" font-size="14" font-style="italic" font-family="serif" text-anchor="middle">x</text>
  
  <text x="238" y="175" fill="#e3b341" font-size="12" font-family="sans-serif">x+Δx</text>  

  <text x="150" y="130" fill="var(--accent)" font-size="16" font-style="italic" font-family="serif" text-anchor="middle">Ф(x)</text>
  
  <!-- ΔΦ label and arrow -->
  <text x="250" y="70" fill="#e3b341" font-size="13" font-family="sans-serif">ΔФ ≈ f(x)·Δx</text>
  <line x1="250" y1="75" x2="222" y2="93" stroke="#e3b341" stroke-width="1.5" marker-end="url(#arr-yellow)" />

  <text x="320" y="45" fill="var(--accent)" font-size="14" font-style="italic" font-family="serif">y = f(t)</text>
</svg>
