<svg viewBox="0 0 400 180" width="400" height="180">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="var(--text2)"/>
    </marker>
  </defs>

  <!-- Grid/Axes -->
  <line x1="30" y1="160" x2="380" y2="160" stroke="var(--text2)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="40" y1="170" x2="40" y2="10" stroke="var(--text2)" stroke-width="1.5" marker-end="url(#arr)"/>
  
  <text x="385" y="165" font-size="12" fill="var(--text2)" font-family="sans-serif">x</text>
  <text x="25" y="15" font-size="12" fill="var(--text2)" font-family="sans-serif">y</text>
  
  <!-- Fill under curve -->
  <path d="M 100 160 L 100 110 C 150 20, 220 150, 300 60 L 300 160 Z" fill="rgba(88, 166, 255, 0.15)"/>
  
  <!-- The Curve f(x) -->
  <path d="M 100 110 C 150 20, 220 150, 300 60" fill="none" stroke="var(--accent)" stroke-width="2.5"/>

  <!-- Average Rectangle -->
  <!-- Let average y be 95, so height is 160-95=65. Area = 200 * 65. -->
  <!-- Check curve at y=95: at x approx 250 curve crosses y=95 -->
  <rect x="100" y="95" width="200" height="65" fill="#e3b341" fill-opacity="0.15" stroke="#e3b341" stroke-width="2" stroke-dasharray="4,4"/>
  
  <!-- Dashed lines -->
  <line x1="40" y1="95" x2="100" y2="95" stroke="var(--text2)" stroke-dasharray="4" stroke-width="1.5"/>
  <line x1="100" y1="160" x2="100" y2="110" stroke="var(--text2)" stroke-dasharray="4" stroke-width="1.5"/>
  <line x1="300" y1="160" x2="300" y2="60" stroke="var(--text2)" stroke-dasharray="4" stroke-width="1.5"/>
  <line x1="260" y1="160" x2="260" y2="95" stroke="#e3b341" stroke-dasharray="4" stroke-width="1.5"/>
  
  <!-- Intersection point ξ -->
  <circle cx="260" cy="95" r="4" fill="#e3b341"/>

  <!-- Labels -->
  <text x="100" y="175" fill="var(--text)" font-size="14" font-style="italic" font-family="serif" text-anchor="middle">a</text>
  <text x="300" y="175" fill="var(--text)" font-size="14" font-style="italic" font-family="serif" text-anchor="middle">b</text>
  <text x="260" y="175" fill="#e3b341" font-size="14" font-style="italic" font-family="serif" text-anchor="middle">ξ</text>
  
  <text x="10" y="98" fill="var(--accent)" font-size="14" font-style="italic" font-family="serif">f(ξ)</text>
  <text x="310" y="60" fill="var(--accent)" font-size="14" font-style="italic" font-family="serif">f(x)</text>
  
  <text x="200" y="125" fill="#e3b341" font-size="12" font-family="sans-serif" text-anchor="middle" font-weight="bold">S = f(ξ)(b - a)</text>
</svg>
