<svg viewBox="0 0 440 185" width="440" height="185">
  <defs>
    <marker id="arrAI" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0 0, 6 3, 0 6" fill="#8b949e"/></marker>
    <linearGradient id="areaGradI" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(9,105,218,0.3)"/>
      <stop offset="100%" stop-color="rgba(9,105,218,0.05)"/>
    </linearGradient>
  </defs>

  <!-- Axes -->
  <line x1="35" y1="145" x2="400" y2="145" stroke="#d0d7de" stroke-width="1.5" marker-end="url(#arrAI)"/>
  <line x1="45" y1="155" x2="45" y2="15" stroke="#d0d7de" stroke-width="1.5" marker-end="url(#arrAI)"/>
  <text x="406" y="152" font-size="14" fill="#8b949e" font-weight="600">x</text>
  <text x="24" y="22" font-size="14" fill="#8b949e" font-weight="600">y</text>

  <!-- Area fill (between curve and x-axis, bounded by a and b) -->
  <path d="M 90 145 L 90 98 Q 165 22 248 65 T 340 55 L 340 145 Z" fill="url(#areaGradI)"/>

  <!-- Function curve -->
  <path d="M 90 98 Q 165 22 248 65 T 340 55" fill="none" stroke="#0969da" stroke-width="3"/>

  <!-- Integration bounds -->
  <line x1="90" y1="145" x2="90" y2="98" stroke="#0969da" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="340" y1="145" x2="340" y2="55" stroke="#0969da" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="90" y="163" font-size="14" fill="#8b949e" font-weight="bold" text-anchor="middle">a</text>
  <text x="340" y="163" font-size="14" fill="#8b949e" font-weight="bold" text-anchor="middle">b</text>

  <!-- Labels -->
  <text x="218" y="38" font-size="16" fill="#0969da" font-weight="bold">f(x)</text>
  <text x="205" y="115" font-size="16" fill="#0969da" text-anchor="middle">∫ f(x) dx
    
  </text>
</svg>