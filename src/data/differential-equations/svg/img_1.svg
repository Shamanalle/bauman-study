<svg viewBox="0 0 440 155" width="440" height="155">
  <defs>
    <marker id="arrW" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#8b949e"/></marker>
  </defs>

  <!-- Wronskian box -->
  <rect x="20" y="15" width="180" height="108" rx="10" fill="rgba(88,166,255,0.12)" stroke="#0969da" stroke-width="1.5"/>
  <text x="35" y="38" font-size="14" fill="#8b949e" font-weight="bold">Вронскиан:</text>

  <!-- Matrix brackets and elements -->
  <text x="52" y="80" font-size="36" fill="#0969da" font-weight="300" font-family="serif">|</text>
  <text x="78" y="70" font-size="16" fill="#0969da" font-family="monospace">y₁  y₂</text>
  <text x="78" y="98" font-size="16" fill="#0969da" font-family="monospace">y₁' y₂'</text>
  <text x="155" y="80" font-size="36" fill="#0969da" font-weight="300" font-family="serif">|</text>

  <!-- Arrow -->
  <line x1="210" y1="72" x2="240" y2="72" stroke="#8b949e" stroke-width="2.5" marker-end="url(#arrW)"/>

  <!-- Result: W ≠ 0 → ФСР -->
  <g>
    
    <rect x="255" y="20" width="172" height="48" rx="8" fill="rgba(46,160,67,0.1)" stroke="#4ac26b" stroke-width="1.5"/>
    <text x="272" y="50" font-size="14" fill="#1a7f37" font-weight="bold">W ≠ 0 ⇒ ФСР (ЛНЗ)</text>
  </g>

  <!-- Result: W = 0 → зависимы -->
  <g>
    
    <rect x="255" y="78" width="172" height="48" rx="8" fill="rgba(255,123,114,0.1)" stroke="#cf222e" stroke-width="1.5"/>
    <text x="272" y="108" font-size="14" fill="#cf222e" font-weight="bold">W = 0 ⇒ Зависимы</text>
  </g>
</svg>