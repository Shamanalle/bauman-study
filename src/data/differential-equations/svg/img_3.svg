<svg viewBox="0 0 440 200" width="440" height="200">
  <defs>
    <marker id="arrNI" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0 0, 6 3, 0 6" fill="#8b949e"/></marker>
  </defs>

  <!-- x-axis -->
  <line x1="35" y1="162" x2="410" y2="162" stroke="#d0d7de" stroke-width="1.5" marker-end="url(#arrNI)"/>
  <text x="416" y="168" font-size="14" fill="#8b949e" font-weight="600">x</text>

  <!-- Singular point vertical line -->
  <line x1="110" y1="162" x2="110" y2="18" stroke="#cf222e" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="110" y="186" font-size="12" fill="#cf222e" font-weight="bold" text-anchor="middle">a (особая точка)</text>

  <!-- b marker -->
  <line x1="340" y1="162" x2="340" y2="130" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="340" y="186" font-size="14" fill="#8b949e" font-weight="bold" text-anchor="middle">b</text>

  <!-- Area fill -->
  <path d="M 115 18 Q 120 108 160 135 T 340 142 L 340 162 L 115 162 Z" fill="rgba(130,80,223,0.12)"/>

  <!-- Function curve (approaches infinity near singularity) -->
  <path d="M 115 18 Q 120 108 160 135 T 340 142" fill="none" stroke="#8250df" stroke-width="3"/>

  <!-- Label -->
  <text x="172" y="48" font-size="14" fill="#8250df" font-weight="bold">f(x) → ∞ при x → a
    
  </text>
</svg>