<svg viewBox="0 0 400 170" width="400" height="170">
  <defs><marker id="arrowX" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><polygon points="0 0, 8 4, 0 8" fill="var(--text2)"/></marker></defs>
  <line x1="80" y1="130" x2="350" y2="130" stroke="var(--text2)" stroke-width="1.5" marker-end="url(#arrowX)"/>
  <text x="355" y="135" font-size="12" fill="var(--text2)">x</text>
  <line x1="120" y1="160" x2="120" y2="10" stroke="var(--text2)" stroke-width="1.5" marker-end="url(#arrowX)"/>
  <text x="110" y="20" font-size="12" fill="var(--text2)">y</text>
  <ellipse cx="200" cy="80" rx="60" ry="40" fill="none" stroke="var(--text2)" stroke-width="2"/>
  <text x="130" y="110" font-size="14" fill="var(--text2)">F(x,y) = 0</text>
  <rect x="210" y="40" width="40" height="40" fill="rgba(45, 164, 78, 0.1)" stroke="#2da44e" stroke-dasharray="4"/>
  <path d="M 210 75 Q 230 65 250 45" fill="none" stroke="#0969da" stroke-width="3"/>
  <circle cx="230" cy="60" r="4" fill="#e5534b"/>
  <text x="240" y="65" font-size="12" fill="#e5534b">(x₀, y₀)</text>
  <text x="260" y="30" font-size="12" fill="#2da44e">Локально (в окрестности)</text>
  <text x="260" y="45" font-size="12" fill="#0969da">задаёт функцию y=f(x)</text>
  <text x="260" y="65" font-size="12" fill="#e5534b">Обязательно: F_y(x₀, y₀) ≠ 0</text>
  <text x="260" y="80" font-size="10" fill="var(--text2)">(касательная не вертикальна)</text>
</svg>