<svg viewBox="0 0 420 185" width="420" height="185">
  <defs>
    <marker id="arrV1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#0969da"/></marker>
    <marker id="arrV2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#cf222e"/></marker>
  </defs>

  <!-- Coordinate system -->
  <line x1="105" y1="135" x2="290" y2="135" stroke="#8b949e" stroke-dasharray="4"/>
  <line x1="105" y1="135" x2="105" y2="15" stroke="#8b949e" stroke-dasharray="4"/>

  <!-- v₁ eigenvector + stretched -->
  <line x1="105" y1="135" x2="188" y2="135" stroke="#0969da" stroke-width="3" marker-end="url(#arrV1)"/>
  <text x="145" y="125" font-size="15" fill="#0969da" font-weight="bold">v₁
    
  </text>

  <line x1="105" y1="135" x2="260" y2="135" stroke="#0969da" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrV1)"/>
  <text x="268" y="130" font-size="12" fill="#0969da">Av₁ = λ₁v₁
    
  </text>

  <!-- v₂ eigenvector + stretched -->
  <line x1="105" y1="135" x2="105" y2="78" stroke="#cf222e" stroke-width="3" marker-end="url(#arrV2)"/>
  <text x="82" y="105" font-size="15" fill="#cf222e" font-weight="bold">v₂
    
  </text>

  <line x1="105" y1="135" x2="105" y2="28" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrV2)"/>
  <text x="25" y="38" font-size="12" fill="#cf222e">Av₂ = λ₂v₂
    
  </text>

  <!-- Info box -->
  <g>
    
    <rect x="238" y="18" width="172" height="78" rx="8" fill="rgba(88,166,255,0.12)" stroke="#0969da" stroke-width="1.5"/>
    <text x="250" y="40" font-size="13" fill="#0969da" font-weight="bold">A = Aᵀ (симметр.)</text>
    <text x="250" y="60" font-size="11" fill="#8b949e">Существует ОНБ из</text>
    <text x="250" y="78" font-size="11" fill="#8b949e">собственных векторов.</text>
  </g>
</svg>