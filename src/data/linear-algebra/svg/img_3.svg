    <marker id="arrV2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0 0, 6 3, 0 6" fill="#cf222e"/></marker>
  </defs>
  
  <line x1="100" y1="120" x2="280" y2="120" stroke="var(--text2)" stroke-dasharray="4"/>
