<svg viewBox="0 0 400 170" width="400" height="170">
  <rect x="20" y="10" width="360" height="135" rx="8" fill="rgba(128,128,128,0.08)" stroke="var(--text2)" stroke-width="1.5"/>
  <rect x="20" y="10" width="360" height="30" rx="8" fill="rgba(128,128,128,0.06)"/>
  <rect x="20" y="30" width="360" height="10" fill="rgba(128,128,128,0.06)"/> 
  <text x="35" y="30" font-size="14" fill="#0969da" font-weight="bold" font-family="monospace">class MyClass {</text>
  <text x="35" y="135" font-size="14" fill="#0969da" font-weight="bold" font-family="monospace">};</text>

  <rect x="40" y="50" width="150" height="55" rx="6" fill="rgba(255,123,114,0.15)" stroke="#ff8182" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="50" y="65" font-size="11" fill="#cf222e" font-weight="bold" font-family="monospace">private:</text>
  <text x="60" y="82" font-size="11" fill="#cf222e" font-family="monospace">int data;</text>
  <text x="60" y="98" font-size="10" fill="#cf222e">🔒 Данные скрыты</text>

  <rect x="210" y="50" width="150" height="55" rx="6" fill="rgba(46,160,67,0.15)" stroke="#4ac26b" stroke-width="1.5"/>
  <text x="220" y="65" font-size="11" fill="#1a7f37" font-weight="bold" font-family="monospace">public:</text>
  <text x="230" y="82" font-size="11" fill="#1a7f37" font-family="monospace">void method();</text>
  <text x="230" y="98" font-size="10" fill="#1a7f37">✓ Доступ открыт</text>

  <path d="M 240 50 Q 195 30 150 50" fill="none" stroke="var(--text2)" stroke-width="2" stroke-dasharray="3" marker-end="url(#arrow_cpp)"/>
  <defs>
      <marker id="arrow_cpp" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><polygon points="0 0, 6 3, 0 6" fill="var(--text2)"/></marker>
  </defs>
  
  <text x="20" y="160" font-size="10" fill="var(--text2)" font-weight="600">Инкапсуляция: методы (public) управляют доступом к данным (private)</text>
</svg>