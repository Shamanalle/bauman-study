<svg viewBox="0 0 420 185" width="420" height="185">
  <defs><marker id="arrow_cpp" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#8b949e"/></marker></defs>

  <rect x="20" y="10" width="376" height="145" rx="10" fill="rgba(36,41,47,0.4)" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="20" y="10" width="376" height="30" rx="10" fill="rgba(139,148,158,0.15)"/>
  <rect x="20" y="30" width="376" height="10" fill="rgba(139,148,158,0.15)"/>
  <text x="38" y="32" font-size="15" fill="#0969da" font-weight="bold" font-family="monospace">class MyClass {</text>
  <text x="38" y="145" font-size="15" fill="#0969da" font-weight="bold" font-family="monospace">};</text>

  <!-- Private section -->
  <g>
    <rect x="42" y="52" width="155" height="58" rx="8" fill="rgba(255,123,114,0.12)" stroke="#ff8182" stroke-width="1.5" stroke-dasharray="4"/>
    <text x="55" y="70" font-size="12" fill="#cf222e" font-weight="bold" font-family="monospace">private:</text>
    <text x="65" y="88" font-size="12" fill="#cf222e" font-family="monospace">int data;</text>
    <text x="65" y="104" font-size="10" fill="#cf222e">🔒 Данные скрыты</text>
  </g>

  <!-- Public section -->
  <g>
    <rect x="218" y="52" width="158" height="58" rx="8" fill="rgba(46,160,67,0.12)" stroke="#4ac26b" stroke-width="1.5"/>
    <text x="230" y="70" font-size="12" fill="#1a7f37" font-weight="bold" font-family="monospace">public:</text>
    <text x="240" y="88" font-size="12" fill="#1a7f37" font-family="monospace">void method();</text>
    <text x="240" y="104" font-size="10" fill="#1a7f37">✓ Доступ открыт</text>
  </g>

  <!-- Arrow linking public to private -->
  <path d="M 248 52 Q 200 32 155 52" fill="none" stroke="#8b949e" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow_cpp)"/>

  <!-- Bottom label -->
  <text x="20" y="175" font-size="11" fill="#8b949e" font-weight="600">Инкапсуляция: методы (public) управляют доступом к данным (private)
    
  </text>
</svg>