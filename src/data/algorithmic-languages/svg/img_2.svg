<svg viewBox="0 0 420 195" width="420" height="195">
  <defs><marker id="arrP" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#0969da"/></marker></defs>

  <!-- External code box -->
  <g>
    <rect x="20" y="20" width="168" height="55" rx="8" fill="rgba(36,41,47,0.4)" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="32" y="38" font-size="12" fill="#8b949e">Внешний код:</text>
    <text x="32" y="60" font-size="13" fill="#2da44e" font-family="monospace">obj.doWork(5);</text>
  </g>

  <!-- Object box -->
  <g>
    <rect x="228" y="20" width="172" height="75" rx="8" fill="rgba(9,105,218,.1)" stroke="#0969da" stroke-width="1.5"/>
    <text x="240" y="40" font-size="13" font-weight="bold" fill="#0969da">Объект obj</text>
    <text x="240" y="60" font-size="11" fill="#8b949e">Адрес: 0x4A...</text>
    <text x="240" y="80" font-size="13" fill="#cf222e" font-family="monospace">int value = 0;</text>
  </g>

  <!-- Method implementation -->
  <g>
    <rect x="20" y="105" width="245" height="68" rx="8" fill="rgba(36,41,47,0.85)" stroke="#8b949e" stroke-width="1.5"/>
    <text x="32" y="128" font-size="12" fill="#4ac26b" font-family="monospace">void doWork(int arg) {</text>
    <text x="48" y="148" font-size="13" fill="#79c0ff" font-weight="bold" font-family="monospace">this->value = arg;</text>
    <text x="32" y="165" font-size="12" fill="#4ac26b" font-family="monospace">}</text>
  </g>

  <!-- this pointer arrow -->
  <g>
    <path d="M 188 142 Q 285 142 285 100" fill="none" stroke="#0969da" stroke-width="2.5" marker-end="url(#arrP)"/>
    <text x="298" y="138" font-size="13" fill="#0969da" font-weight="bold">this = &amp;obj</text>
  </g>
</svg>