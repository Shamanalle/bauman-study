    <path d="M 140 100 Q 110 60 100 40" fill="none" stroke="#8b949e" stroke-width="2.5" stroke-dasharray="6,4" />

    <text x="185" y="100" font-size="18" fill="#1a7f37" font-weight="bold">A</text>

    <text x="290" y="30" font-size="12" fill="#24292f" font-weight="bold">η = 1 − T₂/T₁</text>
