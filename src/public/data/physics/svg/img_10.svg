<svg viewBox="0 0 420 160" width="420" height="160">
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="190" height="65" rx="6" fill="rgba(9,105,218,.1)" stroke="#0969da" stroke-width="1.5"/>
    <text x="10" y="20" font-size="11" fill="#0969da" font-weight="bold">Замедление времени</text>
    <text x="10" y="45" font-size="14" fill="var(--text)" font-weight="bold" font-family="monospace">Δt = Δt₀ / √(1−v²/c²)</text>
  </g>

  <g transform="translate(220, 10)">
    <rect x="0" y="0" width="190" height="65" rx="6" fill="rgba(255,123,114,0.15)" stroke="#cf222e" stroke-width="1.5"/>
    <text x="10" y="20" font-size="11" fill="#cf222e" font-weight="bold">Сокращение длины</text>
    <text x="10" y="45" font-size="14" fill="var(--text)" font-weight="bold" font-family="monospace">l = l₀ · √(1−v²/c²)</text>
  </g>

  <g transform="translate(115, 85)">
    <rect x="0" y="0" width="190" height="65" rx="6" fill="rgba(46,160,67,0.15)" stroke="#2da44e" stroke-width="1.5"/>
    <text x="10" y="20" font-size="11" fill="#1a7f37" font-weight="bold">Сложение скоростей</text>
    <text x="10" y="45" font-size="14" fill="var(--text)" font-weight="bold" font-family="monospace">v = (v₁+v₂) / (1+v₁v₂/c²)</text>
  </g>
</svg>