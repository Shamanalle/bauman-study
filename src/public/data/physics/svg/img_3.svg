<svg viewBox="0 0 420 120" width="420" height="120">
  <defs>
    <linearGradient id="diskGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(9, 105, 218, 0.4)"/>
      <stop offset="100%" stop-color="rgba(9, 105, 218, 0.1)"/>
    </linearGradient>
    <radialGradient id="sphereGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="rgba(9, 105, 218, 0.5)"/>
      <stop offset="100%" stop-color="rgba(9, 105, 218, 0.1)"/>
    </radialGradient>
  </defs>

  <g transform="translate(10, 20)">
    <line x1="40" y1="-10" x2="40" y2="70" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="4"/>
    <ellipse cx="40" cy="30" rx="30" ry="12" fill="none" stroke="#0969da" stroke-width="3"/>
    <text x="40" y="85" font-size="11" fill="#24292f" font-weight="bold" text-anchor="middle">Обруч</text>
    <text x="40" y="100" font-size="11" fill="#0969da" font-weight="bold" text-anchor="middle">mR²</text>
  </g>

  <g transform="translate(110, 20)">
    <line x1="40" y1="-10" x2="40" y2="70" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="4"/>
    <ellipse cx="40" cy="30" rx="30" ry="12" fill="url(#diskGrad)" stroke="#0969da" stroke-width="2"/>
    <text x="40" y="85" font-size="11" fill="#24292f" font-weight="bold" text-anchor="middle">Диск</text>
    <text x="40" y="100" font-size="11" fill="#0969da" font-weight="bold" text-anchor="middle">½ mR²</text>
  </g>

  <g transform="translate(210, 20)">
    <line x1="40" y1="-10" x2="40" y2="70" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="4"/>
    <circle cx="40" cy="30" r="25" fill="url(#sphereGrad)" stroke="#0969da" stroke-width="1.5"/>
    <text x="40" y="85" font-size="11" fill="#24292f" font-weight="bold" text-anchor="middle">Шар</text>
    <text x="40" y="100" font-size="11" fill="#0969da" font-weight="bold" text-anchor="middle">⅖ mR²</text>
  </g>

  <g transform="translate(310, 20)">
    <line x1="15" y1="-10" x2="15" y2="70" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="4"/>
    <rect x="15" y="25" width="60" height="10" rx="3" fill="url(#diskGrad)" stroke="#0969da" stroke-width="1.5"/>
    <text x="45" y="85" font-size="11" fill="#24292f" font-weight="bold" text-anchor="middle">Стержень</text>
    <text x="45" y="100" font-size="11" fill="#0969da" font-weight="bold" text-anchor="middle">⅓ mL²</text>
  </g>
</svg>