<svg viewBox="0 0 420 150" width="420" height="150">
  <ellipse cx="140" cy="75" rx="110" ry="65" fill="rgba(36,41,47,0.4)" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6,4"/>
