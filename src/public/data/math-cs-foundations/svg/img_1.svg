<svg viewBox="0 0 400 160" width="400" height="160">
  <rect x="20" y="20" width="360" height="50" rx="6" fill="rgba(9,105,218,0.06)" stroke="#54aeff" stroke-width="1.5"/>
  <text x="30" y="40" font-size="11" fill="var(--text2)" font-weight="bold">x =</text>
  <text x="65" y="40" font-size="14" fill="var(--text)" font-family="monospace">1  0  1  1  0  1</text>
  <text x="30" y="60" font-size="11" fill="var(--text2)" font-weight="bold">y =</text>
  <text x="65" y="60" font-size="14" fill="var(--text)" font-family="monospace">1  1  1  0  0  1</text>
  <!-- Highlight differences -->
  <rect x="87" y="44" width="16" height="18" rx="3" fill="rgba(207,34,46,0.2)" stroke="#cf222e" stroke-width="1"/>
  <rect x="134" y="44" width="16" height="18" rx="3" fill="rgba(207,34,46,0.2)" stroke="#cf222e" stroke-width="1"/>
  <!-- Distance indicator -->
  <text x="200" y="95" font-size="13" fill="#cf222e" font-weight="bold" text-anchor="middle">ρ(x, y) = 2</text>
  <text x="200" y="112" font-size="10" fill="var(--text2)" text-anchor="middle">(2 несовпадающих разряда — красные)</text>
  <!-- Formula -->
  <rect x="60" y="125" width="280" height="28" rx="4" fill="rgba(45,164,78,0.08)" stroke="#2da44e" stroke-width="1"/>
  <text x="200" y="143" font-size="11" fill="#2da44e" font-weight="bold" text-anchor="middle">ρ(x,y) = #{i : xᵢ ≠ yᵢ} — число несовпадающих разрядов</text>
</svg>