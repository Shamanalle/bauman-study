<svg viewBox="0 0 420 160" width="420" height="160">
  <rect x="10" y="10" width="400" height="140" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="25" y="30" font-size="12" fill="#24292f" font-weight="bold">Таблица истинности булевой функции</text>
  
  <rect x="25" y="45" width="30" height="20" rx="4" fill="#e6f0fa" stroke="#0969da" stroke-width="1"/>
  <text x="40" y="59" font-size="12" fill="#0969da" font-weight="bold" text-anchor="middle">x₁</text>
  
  <rect x="60" y="45" width="30" height="20" rx="4" fill="#e6f0fa" stroke="#0969da" stroke-width="1"/>
  <text x="75" y="59" font-size="12" fill="#0969da" font-weight="bold" text-anchor="middle">x₂</text>
  
  <rect x="100" y="45" width="40" height="20" rx="4" fill="#dafbe1" stroke="#2da44e" stroke-width="1"/>
  <text x="120" y="59" font-size="12" fill="#1a7f37" font-weight="bold" text-anchor="middle">f(x)</text>

  <text x="40" y="80" font-size="12" fill="#8b949e" font-family="monospace" text-anchor="middle">0</text>
  <text x="75" y="80" font-size="12" fill="#8b949e" font-family="monospace" text-anchor="middle">0</text>
  <text x="120" y="80" font-size="12" fill="#1a7f37" font-family="monospace" font-weight="bold" text-anchor="middle">1</text>

  <text x="40" y="95" font-size="12" fill="#8b949e" font-family="monospace" text-anchor="middle">0</text>
  <text x="75" y="95" font-size="12" fill="#8b949e" font-family="monospace" text-anchor="middle">1</text>
  <text x="120" y="95" font-size="12" fill="#1a7f37" font-family="monospace" font-weight="bold" text-anchor="middle">0</text>

  <text x="40" y="110" font-size="12" fill="#8b949e" font-family="monospace" text-anchor="middle">1</text>
  <text x="75" y="110" font-size="12" fill="#8b949e" font-family="monospace" text-anchor="middle">0</text>
  <text x="120" y="110" font-size="12" fill="#1a7f37" font-family="monospace" font-weight="bold" text-anchor="middle">1</text>

  <text x="40" y="125" font-size="12" fill="#8b949e" font-family="monospace" text-anchor="middle">1</text>
  <text x="75" y="125" font-size="12" fill="#8b949e" font-family="monospace" text-anchor="middle">1</text>
  <text x="120" y="125" font-size="12" fill="#1a7f37" font-family="monospace" font-weight="bold" text-anchor="middle">0</text>

  <line x1="160" y1="45" x2="160" y2="130" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4"/>

  <text x="180" y="65" font-size="12" fill="#8b949e" font-weight="bold">Количество строк:</text>
  <text x="310" y="65" font-size="14" fill="#0969da" font-weight="bold">2ⁿ</text>
  <text x="180" y="80" font-size="11" fill="#8b949e">(Лексикографический порядок)</text>
  
  <text x="180" y="110" font-size="12" fill="#8b949e" font-weight="bold">Всего булевых функций:</text>
  <text x="340" y="110" font-size="14" fill="#cf222e" font-weight="bold">2^(2ⁿ)</text>
</svg>