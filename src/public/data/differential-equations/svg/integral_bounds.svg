<svg viewBox="0 0 400 180" width="400" height="180">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="var(--text2)"/>
    </marker>
  </defs>

  <!-- Grid/Axes -->
  <line x1="30" y1="160" x2="380" y2="160" stroke="var(--text2)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="40" y1="170" x2="40" y2="10" stroke="var(--text2)" stroke-width="1.5" marker-end="url(#arr)"/>
  
  <text x="385" y="165" font-size="12" fill="var(--text2)" font-family="sans-serif">x</text>
  <text x="25" y="15" font-size="12" fill="var(--text2)" font-family="sans-serif">y</text>
  
  <!-- Dashed lines -->
  <line x1="40" y1="40" x2="300" y2="40" stroke="var(--text2)" stroke-dasharray="4" stroke-width="1.5"/>
  <line x1="40" y1="110" x2="300" y2="110" stroke="var(--text2)" stroke-dasharray="4" stroke-width="1.5"/>
  <line x1="100" y1="160" x2="100" y2="40" stroke="var(--text2)" stroke-dasharray="4" stroke-width="1.5"/>
  <line x1="300" y1="160" x2="300" y2="40" stroke="var(--text2)" stroke-dasharray="4" stroke-width="1.5"/>
  
  <!-- Labels -->
  <text x="95" y="175" fill="var(--text)" font-size="14" font-style="italic" font-family="serif">a</text>
  <text x="295" y="175" fill="var(--text)" font-size="14" font-style="italic" font-family="serif">b</text>
  <text x="20" y="45" fill="var(--text)" font-size="14" font-style="italic" font-family="serif">M</text>
  <text x="20" y="115" fill="var(--text)" font-size="14" font-style="italic" font-family="serif">m</text>
  
  <!-- Max Area -->
  <rect x="100" y="40" width="200" height="120" fill="none" stroke="#cf222e" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="200" y="55" fill="#cf222e" font-size="12" font-family="sans-serif" text-anchor="middle" font-weight="bold">S = M(b - a)</text>
  
  <!-- Fill under curve -->
  <path d="M 100 110 C 140 110, 140 40, 180 40 C 220 40, 240 80, 300 80 L 300 160 L 100 160 Z" fill="rgba(45, 164, 78, 0.15)"/>
  
  <!-- Function curve -->
  <path d="M 100 110 C 140 110, 140 40, 180 40 C 220 40, 240 80, 300 80" fill="none" stroke="var(--accent)" stroke-width="2.5"/>

  <!-- Min Area -->
  <rect x="100" y="110" width="200" height="50" fill="none" stroke="#0969da" stroke-width="2" stroke-dasharray="4,4"/>
  <rect x="100" y="110" width="200" height="50" fill="rgba(9, 105, 218, 0.15)"/>
  <text x="200" y="130" fill="#0969da" font-size="12" font-family="sans-serif" text-anchor="middle" font-weight="bold">s = m(b - a)</text>
  
  <text x="280" y="65" fill="var(--accent)" font-size="14" font-style="italic" font-family="serif">f(x)</text>
</svg>
