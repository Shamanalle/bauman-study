<svg viewBox="0 0 400 130" width="400" height="130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#0969da"/>
    </marker>
  </defs>

  <!-- Source Files -->
  <rect x="10" y="25" width="80" height="55" rx="8" fill="rgba(191,135,0,0.1)" stroke="#d29922" stroke-width="1.2"/>
  <text x="50" y="47" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="var(--text)">Исходники</text>
  <text x="50" y="63" text-anchor="middle" font-family="monospace" font-size="9" fill="var(--text2)">.cpp .hpp</text>

  <!-- CMake Generate -->
  <rect x="115" y="25" width="80" height="55" rx="8" fill="rgba(9,105,218,0.08)" stroke="#54aeff" stroke-width="1.2"/>
  <text x="155" y="47" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="var(--text)">Генерация</text>
  <text x="155" y="63" text-anchor="middle" font-family="monospace" font-size="9" fill="#0969da">cmake -B</text>

  <!-- Build -->
  <rect x="220" y="25" width="80" height="55" rx="8" fill="rgba(130,80,223,0.08)" stroke="#a371f7" stroke-width="1.2"/>
  <text x="260" y="47" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="var(--text)">Сборка</text>
  <text x="260" y="63" text-anchor="middle" font-family="monospace" font-size="9" fill="#8250df">--build</text>

  <!-- Result -->
  <rect x="325" y="25" width="65" height="55" rx="8" fill="rgba(45,164,78,0.1)" stroke="#3fb950" stroke-width="1.2"/>
  <text x="358" y="47" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="var(--text)">binary</text>
  <text x="358" y="63" text-anchor="middle" font-family="monospace" font-size="9" fill="#2da44e">/ .a</text>

  <!-- Arrows -->
  <line x1="90" y1="52" x2="111" y2="52" stroke="#0969da" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="195" y1="52" x2="216" y2="52" stroke="#0969da" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="300" y1="52" x2="321" y2="52" stroke="#0969da" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Bottom label: CMakeLists.txt -->
  <text x="50" y="100" text-anchor="middle" font-family="monospace" font-size="8" fill="var(--text2)">CMakeLists.txt</text>
  <text x="155" y="100" text-anchor="middle" font-family="monospace" font-size="8" fill="var(--text2)">Makefile</text>
  <text x="260" y="100" text-anchor="middle" font-family="monospace" font-size="8" fill="var(--text2)">g++ / make</text>
  <text x="358" y="100" text-anchor="middle" font-family="monospace" font-size="8" fill="var(--text2)">executable</text>

  <!-- Title -->
  <text x="200" y="125" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text2)">Процесс сборки CMake</text>
</svg>
