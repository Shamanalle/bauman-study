<svg viewBox="0 0 400 130" width="400" height="130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#0969da"/>
    </marker>
  </defs>

  <!-- git push -->
  <rect x="10" y="25" width="70" height="55" rx="8" fill="rgba(191,135,0,0.1)" stroke="#d29922" stroke-width="1.2"/>
  <text x="45" y="47" text-anchor="middle" font-family="monospace" font-size="10" font-weight="600" fill="var(--text)">push</text>
  <text x="45" y="63" text-anchor="middle" font-family="sans-serif" font-size="9" fill="var(--text2)">Триггер</text>

  <!-- GitHub Actions -->
  <rect x="105" y="25" width="80" height="55" rx="8" fill="rgba(9,105,218,0.08)" stroke="#54aeff" stroke-width="1.2"/>
  <text x="145" y="47" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="var(--text)">GitHub</text>
  <text x="145" y="63" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#0969da">Actions</text>

  <!-- Build -->
  <rect x="210" y="25" width="60" height="55" rx="8" fill="rgba(130,80,223,0.08)" stroke="#a371f7" stroke-width="1.2"/>
  <text x="240" y="47" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="var(--text)">Build</text>
  <text x="240" y="63" text-anchor="middle" font-family="sans-serif" font-size="9" fill="var(--text2)">Сборка</text>

  <!-- Test -->
  <rect x="295" y="25" width="55" height="55" rx="8" fill="rgba(45,164,78,0.1)" stroke="#3fb950" stroke-width="1.2"/>
  <text x="323" y="47" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="var(--text)">Test</text>
  <text x="323" y="63" text-anchor="middle" font-family="sans-serif" font-size="9" fill="var(--text2)">Тесты</text>

  <!-- Status badge -->
  <circle cx="375" cy="52" r="18" fill="rgba(45,164,78,0.15)" stroke="#3fb950" stroke-width="1.5"/>
  <text x="375" y="57" text-anchor="middle" font-size="16">✅</text>

  <!-- Arrows -->
  <line x1="80" y1="52" x2="101" y2="52" stroke="#0969da" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="185" y1="52" x2="206" y2="52" stroke="#0969da" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="270" y1="52" x2="291" y2="52" stroke="#0969da" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="350" y1="52" x2="354" y2="52" stroke="#2da44e" stroke-width="1.5"/>

  <!-- Bottom labels -->
  <text x="45" y="100" text-anchor="middle" font-family="monospace" font-size="8" fill="var(--text2)">on: push</text>
  <text x="145" y="100" text-anchor="middle" font-family="monospace" font-size="8" fill="var(--text2)">.yml workflow</text>
  <text x="240" y="100" text-anchor="middle" font-family="monospace" font-size="8" fill="var(--text2)">cmake</text>
  <text x="323" y="100" text-anchor="middle" font-family="monospace" font-size="8" fill="var(--text2)">ctest</text>

  <!-- Title -->
  <text x="200" y="125" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text2)">CI/CD Pipeline — GitHub Actions</text>
</svg>
