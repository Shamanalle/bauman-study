<svg viewBox="0 0 400 160" width="400" height="160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#0969da"/>
    </marker>
    <marker id="arrG" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#2da44e"/>
    </marker>
  </defs>

  <!-- Working Directory -->
  <rect x="10" y="30" width="80" height="50" rx="8" fill="rgba(9,105,218,0.06)" stroke="#54aeff" stroke-width="1.2"/>
  <text x="50" y="50" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="var(--text)">Working</text>
  <text x="50" y="66" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="var(--text)">Directory</text>

  <!-- Staging Area -->
  <rect x="120" y="30" width="80" height="50" rx="8" fill="rgba(130,80,223,0.08)" stroke="#a371f7" stroke-width="1.2"/>
  <text x="160" y="50" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="var(--text)">Staging</text>
  <text x="160" y="66" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="var(--text)">Area</text>

  <!-- Local Repository -->
  <rect x="230" y="30" width="80" height="50" rx="8" fill="rgba(45,164,78,0.1)" stroke="#3fb950" stroke-width="1.2"/>
  <text x="270" y="50" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="var(--text)">Local</text>
  <text x="270" y="66" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="var(--text)">Repository</text>

  <!-- Remote (GitHub) -->
  <rect x="340" y="30" width="50" height="50" rx="8" fill="rgba(191,135,0,0.1)" stroke="#d29922" stroke-width="1.2"/>
  <text x="365" y="50" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="var(--text)">Remote</text>
  <text x="365" y="64" text-anchor="middle" font-family="sans-serif" font-size="9" fill="var(--text2)">(GitHub)</text>

  <!-- Arrows: forward flow -->
  <line x1="90" y1="48" x2="116" y2="48" stroke="#0969da" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="103" y="42" text-anchor="middle" font-family="monospace" font-size="8" font-weight="600" fill="#0969da">add</text>

  <line x1="200" y1="48" x2="226" y2="48" stroke="#0969da" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="213" y="42" text-anchor="middle" font-family="monospace" font-size="8" font-weight="600" fill="#0969da">commit</text>

  <line x1="310" y1="48" x2="336" y2="48" stroke="#0969da" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="323" y="42" text-anchor="middle" font-family="monospace" font-size="8" font-weight="600" fill="#0969da">push</text>

  <!-- Arrow: pull (reverse) -->
  <line x1="336" y1="68" x2="310" y2="68" stroke="#2da44e" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="323" y="78" text-anchor="middle" font-family="monospace" font-size="8" font-weight="600" fill="#2da44e">pull</text>

  <!-- Подписи-пояснения -->
  <text x="50" y="105" text-anchor="middle" font-family="monospace" font-size="8" fill="var(--text2)">git status</text>
  <text x="50" y="120" text-anchor="middle" font-family="monospace" font-size="8" fill="var(--text2)">git diff</text>
  <text x="160" y="105" text-anchor="middle" font-family="monospace" font-size="8" fill="var(--text2)">git reset</text>
  <text x="270" y="105" text-anchor="middle" font-family="monospace" font-size="8" fill="var(--text2)">git log</text>

  <!-- Title -->
  <text x="200" y="148" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text2)">Три области Git — поток данных</text>
</svg>
