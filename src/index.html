<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Баумана · Подготовка к экзаменам</title>
  <meta name="description" content="Интерактивная платформа подготовки к экзаменам, зачётам и контрольным работам МГТУ им. Н.Э. Баумана">
  <meta name="theme-color" content="#1f883d">
  <meta property="og:title" content="Баумана · Подготовка к экзаменам">
  <meta property="og:description" content="Интерактивная платформа подготовки к экзаменам, зачётам и контрольным работам МГТУ им. Н.Э. Баумана">
  <meta property="og:type" content="website">
  <meta property="og:image" content="./icon-192.svg">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>
  <header class="site-header" id="siteHeader">
    <div class="site-header-inner">
      <div class="header-left">
        <a href="./" class="header-brand" id="headerBrandLink" title="На главную Bauman Study">
          <span class="brand-icon">🎓</span>
          <span class="brand-title">Bauman Study</span>
          <span class="brand-badge">v2.0</span>
        </a>
      </div>
      <div class="header-center">
        <button class="header-search-btn" id="headerSearchBtn" title="Быстрый поиск (Ctrl+K)">
          <span class="search-btn-icon">🔍</span>
          <span class="search-btn-text">Поиск по базе...</span>
          <kbd class="search-btn-kbd">Ctrl K</kbd>
        </button>
      </div>
      <div class="header-right">
        <button class="header-icon-btn" id="themeToggleBtn" title="Переключить тему (T)">
          <span class="theme-icon">🌙</span>
        </button>
        <button class="header-icon-btn" id="shortcutsHeaderBtn" title="Горячие клавиши (?)">
          <span>⌨️</span>
        </button>
        <a href="https://github.com/Shamanalle/bauman-study" target="_blank" rel="noopener noreferrer" class="header-icon-btn header-gh-btn" title="GitHub репозиторий" aria-label="GitHub">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
          </svg>
        </a>
      </div>
    </div>
  </header>

  <div class="app" id="app">
    <!-- Hero -->
    <div class="hero">
      <div class="hero-badge">🎓 Семестр 2 · МГТУ им. Н.Э. Баумана</div>
      <h1 id="heroTitle" class="hero-title">База знаний и тренажёр к экзаменам</h1>
      <p id="heroSubtitle" class="hero-subtitle">Билеты, алгоритмы, интерактивная практика и симулятор контрольных мероприятий</p>
      <div class="stats-row">
        <div class="stat-pill">✅ <span id="learnedCount">0</span> / <span id="totalCount">0</span> выучено · <span id="secDone">0</span>/<span id="secTotal">0</span> разделов</div>
        <button class="stat-pill dark-toggle" id="darkToggle" title="Переключить тему">🌙</button>
      </div>
      <div class="progress-bar-hero"><div class="progress-fill-hero" id="heroProgress"></div></div>
    </div>

    <!-- Navigation -->
    <div class="nav">
      <div style="position:relative;flex:1">
        <input type="text" placeholder="🔍 Поиск..." id="search">
        <button class="search-clear" id="searchClear">✕</button>
      </div>

      <button class="nav-btn" id="randomBtn" title="Перейти к случайному вопросу">🎲</button>
      <button class="nav-btn" id="toggleBtn" title="Развернуть / свернуть все вопросы">📖 Открыть всё</button>
    </div>

    <!-- Section filter pills -->
    <div class="section-pills" id="sectionPills"></div>

    <!-- Content -->
    <div id="content"></div>
  </div>

  <button class="scroll-top" id="scrollTop" title="Наверх">↑</button>



  <script type="module" src="/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
